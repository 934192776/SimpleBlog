<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <h2>
      {{ question.question_text }}
  </h2>

  <form method="post" action="{%  urll 'vote' %}">
     {% csrf_token %}

  <ul>
    {%  for choice in question.choice_set.all %}
        <input type="radio" name="choice"
           value="{{ choice.id }}">

       {{ choice.choice_text }}
        -
        Votes:{{ choice.votes }}
    <br>


    {%  endfor %}
  </ul>
  <input type="submit" value="Vote">
</form>

</body>
</html>
